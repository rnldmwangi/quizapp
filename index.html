<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDACC Workspace Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0B0D10', surface: '#161920', border: '#242936',
                        accent: '#38BDF8', 'text-primary': '#E3E6ED', 'text-muted': '#94A3B8',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0D10; color: #E3E6ED; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-surface border border-border p-8 rounded-xl shadow-2xl text-center">
        <div class="w-20 h-20 bg-background border border-border rounded-full flex items-center justify-center text-4xl mx-auto mb-6" id="avatarDisplay">⚡</div>
        
        <h1 class="text-2xl font-bold text-text-primary mb-2" id="welcomeText">System Initializing...</h1>
        <p class="text-sm text-text-muted mb-8">CDACC Level 5 & 6 Interactive Testing Engine</p>
        
        <div class="space-y-4">
            <a href="app.html" class="block w-full py-3 bg-accent text-background font-bold rounded hover:bg-opacity-90 transition-all shadow-lg hover:shadow-accent/20">
                Launch Workspace Engine
            </a>
            <button onclick="resetSystem()" class="block w-full py-3 bg-background border border-border text-text-muted font-bold rounded hover:text-red-400 hover:border-red-900/50 transition-all">
                Purge Local Data & Reset
            </button>
        </div>
        
        <div class="mt-8 pt-4 border-t border-border text-[10px] text-text-muted uppercase tracking-widest font-mono">
            Zero-Overhead Serverless Client
        </div>
    </div>

    <script>
        // Check for existing profile on load
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('quiz_user');
            const welcomeText = document.getElementById('welcomeText');
            const avatarDisplay = document.getElementById('avatarDisplay');
            
            if (savedUser) {
                const user = JSON.parse(savedUser);
                welcomeText.textContent = `Welcome back, ${user.name}`;
                avatarDisplay.textContent = user.avatar || '⚡';
            } else {
                welcomeText.textContent = `Welcome, Trainee`;
            }
        });

        function resetSystem() {
            if (confirm("Are you sure you want to purge all assessment data and reset your profile?")) {
                localStorage.clear();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
